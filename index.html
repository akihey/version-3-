<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>クラッカー（軽くパンッ版）</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: sans-serif;
  background: radial-gradient(circle at top, rgba(73,144,202,0.15), transparent 30%), linear-gradient(180deg,#f7fafc,#dee0da);
}

.stage {
  position: relative;
  width: 320px;
  height: 500px;
  background: #ffffff;
  border-radius: 24px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(73,144,202,0.16);
  overflow: hidden;
}

h1 {
  font-size: 28px;
  color: #e8415b;
}

button {
  margin-top: 20px;
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  border: none;
  background: #4990ca;
  color: #ffffff;
  font-weight: bold;
}

.cracker {
  position: absolute;
  bottom: 22px;
  font-size: 42px;
  z-index: 2;
}

.left { left: 24px; transform: rotate(-20deg); }
.right { right: 24px; transform: rotate(20deg); }

.cracker.pop-left {
  animation: popLeft .35s ease-out;
}

.cracker.pop-right {
  animation: popRight .35s ease-out;
}

@keyframes popLeft {
  0% { transform: rotate(-20deg) scale(1); }
  35% { transform: rotate(-28deg) scale(1.12) translate(-2px, 2px); }
  100% { transform: rotate(-20deg) scale(1); }
}

@keyframes popRight {
  0% { transform: rotate(20deg) scale(1); }
  35% { transform: rotate(28deg) scale(1.12) translate(2px, 2px); }
  100% { transform: rotate(20deg) scale(1); }
}

.confetti {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 2px;
  opacity: 0;
  z-index: 1;
}

.confetti.fly {
  animation: softPop 1.35s ease-out forwards;
}

@keyframes softPop {
  0% {
    opacity: 0;
    transform: translate(0,0) rotate(0deg) scale(.5);
  }
  12% {
    opacity: 1;
    transform: translate(calc(var(--x) * .45), calc(var(--y) * .45)) rotate(80deg) scale(1.05);
  }
  45% {
    opacity: 1;
    transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(calc(var(--x) * 1.08), calc(var(--y) + 90px)) rotate(calc(var(--r) + 180deg)) scale(.8);
  }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <h1>ミッションクリア！</h1>
  <button onclick="play()">もう一回</button>

  <div class="cracker left" id="leftCracker">🎉</div>
  <div class="cracker right" id="rightCracker">🎉</div>
</div>

<script>
const colors = ['#4990ca','#e8415b','#dee0da','#6faedb','#f06b80'];
const stage = document.getElementById('stage');
const leftCracker = document.getElementById('leftCracker');
const rightCracker = document.getElementById('rightCracker');

function play(){
  document.querySelectorAll('.confetti').forEach(el => el.remove());

  leftCracker.classList.remove('pop-left');
  rightCracker.classList.remove('pop-right');
  void leftCracker.offsetWidth;

  leftCracker.classList.add('pop-left');
  rightCracker.classList.add('pop-right');

  burstFrom(70, 395, 1);
  burstFrom(250, 395, -1);
}

function burstFrom(originX, originY, direction){
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'confetti';

    const angle = direction === 1
      ? -115 + Math.random() * 70
      : -135 - Math.random() * 70;

    const power = 55 + Math.random() * 90;
    const rad = angle * Math.PI / 180;
    const x = Math.cos(rad) * power;
    const y = Math.sin(rad) * power;

    el.style.left = originX + 'px';
    el.style.top = originY + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = 5 + Math.random() * 6 + 'px';
    el.style.height = 5 + Math.random() * 8 + 'px';
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    el.style.setProperty('--r', 120 + Math.random() * 420 + 'deg');
    el.style.animationDelay = Math.random() * .08 + 's';

    if(Math.random() > .7) el.style.borderRadius = '50%';

    stage.appendChild(el);
    requestAnimationFrame(() => el.classList.add('fly'));
    setTimeout(() => el.remove(), 1500);
  }
}

window.onload = play;
</script>

</body>
</html>
